<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bat Fit Quiz Report &mdash; Z-Bat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* ── Tokens ─────────────────────────────────────────────────────────────
   Light is complete on bare :root. Dark redefines ONLY tokens, twice:
   once for OS-dark (guarded so an explicit light stamp wins) and once
   for the data-theme stamp. Components never read a raw hex.            */
:root {
  color-scheme: light;
  --plane:        #eeece2;
  --surface:      #faf9f5;
  --surface-sunk: #f2f0e7;
  --ink:          #151a13;
  --ink-2:        #4a5247;
  --ink-3:        #7d857a;
  --rule:         #d9d7cb;
  --rule-soft:    #e6e4da;
  --accent:       #2f8a5d;
  --accent-deep:  #14603c;
  --accent-wash:  rgba(47,138,93,.13);
  --warn:         #fab219;
  --warn-ink:     #6b4a00;
  --warn-wash:    rgba(250,178,25,.18);
  --crit:         #d03b3b;
  --crit-ink:     #8e1f1f;
  --crit-wash:    rgba(208,59,59,.12);
  --shadow:       0 1px 2px rgba(21,26,19,.05), 0 8px 24px -18px rgba(21,26,19,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:        #0d0f0c;
    --surface:      #131611;
    --surface-sunk: #191d17;
    --ink:          #f2f4ef;
    --ink-2:        #b8bfb3;
    --ink-3:        #868d81;
    --rule:         #2a2f26;
    --rule-soft:    #21261e;
    --accent:       #4aa878;
    --accent-deep:  #9ccdb1;
    --accent-wash:  rgba(74,168,120,.18);
    --warn:         #fab219;
    --warn-ink:     #fad48a;
    --warn-wash:    rgba(250,178,25,.14);
    --crit:         #d03b3b;
    --crit-ink:     #f0a3a3;
    --crit-wash:    rgba(208,59,59,.16);
    --shadow:       0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:        #0d0f0c;
  --surface:      #131611;
  --surface-sunk: #191d17;
  --ink:          #f2f4ef;
  --ink-2:        #b8bfb3;
  --ink-3:        #868d81;
  --rule:         #2a2f26;
  --rule-soft:    #21261e;
  --accent:       #4aa878;
  --accent-deep:  #9ccdb1;
  --accent-wash:  rgba(74,168,120,.18);
  --warn:         #fab219;
  --warn-ink:     #fad48a;
  --warn-wash:    rgba(250,178,25,.14);
  --crit:         #d03b3b;
  --crit-ink:     #f0a3a3;
  --crit-wash:    rgba(208,59,59,.16);
  --shadow:       0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--plane);
  color: var(--ink);
  font-family: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1140px; margin: 0 auto; padding: 28px 20px 80px; }

/* ── Type roles ──────────────────────────────────────────────────────── */
.mono    { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
.eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; font-weight: 500; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }

/* ── Masthead ────────────────────────────────────────────────────────── */
.masthead { border-top: 3px solid var(--ink); padding-top: 12px; margin-bottom: 26px; }
.masthead-top { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; justify-content: space-between; }
.masthead h1 { font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 80; font-weight: 900; letter-spacing: -.025em; font-size: clamp(28px, 4.6vw, 44px); line-height: 1.02; margin: 6px 0 0; text-wrap: balance; }
.masthead .sub { color: var(--ink-2); margin: 8px 0 0; max-width: 62ch; }
.rule-double { border: 0; border-top: 1px solid var(--rule); border-bottom: 3px solid var(--ink); height: 4px; margin: 14px 0 0; }

/* ── Notice ──────────────────────────────────────────────────────────── */
.notice { display: flex; gap: 11px; align-items: flex-start; padding: 13px 15px; border-radius: 3px; margin: 22px 0 0; background: var(--accent-wash); border-left: 3px solid var(--accent); }
.notice .glyph { flex: none; width: 17px; height: 17px; margin-top: 1px; color: var(--accent-deep); }
.notice p { margin: 0; font-size: 14px; color: var(--ink); }
.notice strong { font-weight: 600; }

/* ── Hero ────────────────────────────────────────────────────────────── */
.hero { display: grid; grid-template-columns: minmax(0,auto) 1fr; gap: 10px 44px; align-items: end; margin: 30px 0 8px; }
.hero-figure { font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 78; font-weight: 900; font-size: clamp(64px, 13vw, 132px); line-height: .82; letter-spacing: -.045em; color: var(--accent-deep); }
.hero-side { padding-bottom: 8px; }
.hero-side p { margin: 0; color: var(--ink-2); max-width: 46ch; font-size: 15px; }
.hero-side .lede { color: var(--ink); font-size: 17px; font-weight: 500; margin-bottom: 6px; }
.hero-side .lede b, .hero-side p b { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 600; }
@media (max-width: 620px) { .hero { grid-template-columns: 1fr; } .hero-side { padding-bottom: 0; } }

/* ── Stat tiles ──────────────────────────────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 26px 0 0; }
.tile { background: var(--surface); padding: 14px 15px 15px; }
.tile .k { display: block; margin-bottom: 7px; }
.tile .v { font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 92; font-weight: 700; font-size: 27px; line-height: 1; letter-spacing: -.02em; display: block; }
.tile .n { display: block; margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }

/* ── Sections & cards ────────────────────────────────────────────────── */
section { margin-top: 46px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 4px; }
.sec-head h2 { font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 84; font-weight: 800; letter-spacing: -.02em; font-size: 21px; margin: 0; }
.sec-head .note { font-size: 13px; color: var(--ink-3); margin: 0; }
.sec-intro { color: var(--ink-2); max-width: 66ch; margin: 14px 0 20px; font-size: 14.5px; }
.card { background: var(--surface); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 20px; margin-top: 18px; }

/* ── Chart chrome ────────────────────────────────────────────────────── */
.chart-title { font-weight: 600; font-size: 13.5px; margin: 0 0 2px; }
.chart-sub { font-size: 12.5px; color: var(--ink-3); margin: 0 0 14px; }

/* Horizontal bar rows */
.bars { display: flex; flex-direction: column; gap: 3px; }
.brow { display: grid; grid-template-columns: var(--label-w, 150px) 1fr var(--num-w, 190px); align-items: center; gap: 14px; padding: 5px 6px; border-radius: 3px; cursor: default; }
.brow:hover, .brow:focus-visible { background: var(--surface-sunk); outline: none; }
.brow:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.brow .lab { font-size: 13.5px; font-weight: 500; min-width: 0; }
.brow .lab .qual { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
.track { position: relative; height: 14px; background: var(--surface-sunk); border-radius: 2px; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.fill.is-crit { background: var(--crit); }
.tip-lab { position: absolute; top: 50%; transform: translateY(-50%); left: calc(var(--w) + 9px); font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.brow .nums { text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); display: flex; gap: 14px; justify-content: flex-end; }
.brow .nums b { color: var(--ink); font-weight: 600; }
@media (max-width: 700px) {
  .brow { grid-template-columns: 1fr; gap: 6px; padding: 9px 6px; border-bottom: 1px solid var(--rule-soft); border-radius: 0; }
  .brow .nums { justify-content: flex-start; }
  /* drop the numeric end-labels at this width, but keep the status chips —
     they are what makes a flagged row readable without relying on colour */
  .tip-lab { display: none; }
  .tip-lab:has(.chip) { display: block; position: static; transform: none; left: auto; }
}

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px 2px 5px; border-radius: 2px; white-space: nowrap; }
.chip svg { width: 11px; height: 11px; flex: none; }
.chip.crit { background: var(--crit-wash); color: var(--crit-ink); }
.chip.warn { background: var(--warn-wash); color: var(--warn-ink); }

/* ── Hourly small multiples ──────────────────────────────────────────── */
.hourly { display: flex; flex-direction: column; gap: 18px; }
.hband { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: stretch; }
.hband .hlab { align-self: end; padding-bottom: 2px; }
.hband .hlab .t { font-size: 12.5px; font-weight: 600; display: block; line-height: 1.25; }
.hband .hlab .s { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-3); display: block; margin-top: 2px; }
.plot { position: relative; height: 68px; border-bottom: 1px solid var(--rule); display: flex; align-items: flex-end; gap: 3px; }
.col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; cursor: default; }
.col:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.col .mark { width: 100%; max-width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 1px; }
.col .none { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 9px; border-top: 2px dotted var(--ink-3); }
.col:hover .mark { filter: brightness(1.08); }
.hshade { position: absolute; top: 0; bottom: 0; left: 0; background: var(--crit-wash); border-radius: 2px; }
.hshade-lab { position: absolute; top: 2px; left: 24%; font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--crit-ink); }
.haxis { display: flex; gap: 3px; margin-top: 6px; }
.haxis span { flex: 1 1 0; text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
@media (max-width: 700px) {
  .hband { grid-template-columns: 1fr; gap: 4px; }
  .hband .hlab { align-self: start; padding-bottom: 0; }
  .haxis span { font-size: 8px; }
}

/* ── Tooltip ─────────────────────────────────────────────────────────── */
#tip { position: fixed; z-index: 50; pointer-events: none; opacity: 0; transform: translate(-50%, -100%); transition: opacity .09s ease; background: var(--ink); color: var(--plane); padding: 8px 10px; border-radius: 3px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; line-height: 1.55; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 6px 20px -8px rgba(0,0,0,.5); }
#tip.on { opacity: 1; }
#tip .th { font-weight: 600; display: block; margin-bottom: 3px; }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } * { animation: none !important; } }

/* ── Tables ──────────────────────────────────────────────────────────── */
details { margin-top: 16px; border-top: 1px solid var(--rule-soft); padding-top: 12px; }
summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); font-weight: 500; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; font-family: "IBM Plex Mono", monospace; color: var(--ink-3); }
details[open] summary::before { content: "−"; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.tscroll { overflow-x: auto; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 560px; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--rule-soft); font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
th { color: var(--ink-3); font-weight: 500; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; border-bottom: 1px solid var(--rule); }
th:first-child, td:first-child { text-align: left; font-family: "Public Sans", sans-serif; }
tbody tr:hover { background: var(--surface-sunk); }
td.hi { color: var(--ink); font-weight: 600; }

/* ── Two-day comparison ──────────────────────────────────────────────── */
.cmp { width: 100%; min-width: 480px; }
.cmp td.metric { font-family: "Public Sans", sans-serif; text-align: left; font-weight: 500; font-size: 13px; }
.cmp td.metric span { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
.cmp .d1 { color: var(--ink); font-weight: 600; }
.cmp .d2 { color: var(--ink); font-weight: 600; }
.cmp tr.flag td { background: var(--crit-wash); }

.ph td.metric { font-family: "Public Sans", sans-serif; text-align: left; font-weight: 500; font-size: 13px; }
.ph td.metric span { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
.ph th.bad, .ph td.bad { background: var(--crit-wash); }
.ph th.good, .ph td.good { background: var(--accent-wash); }
.ph td.big { font-weight: 600; color: var(--ink); }

/* ── Pair tiles ──────────────────────────────────────────────────────── */
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.pair > div { background: var(--surface); padding: 16px 17px; }
.pair .q { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.pair .vals { display: flex; align-items: baseline; gap: 12px; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.pair .vals b { font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 92; font-weight: 700; font-size: 24px; letter-spacing: -.02em; }
.pair .vals .arrow { color: var(--ink-3); }
.pair .cap { display: block; margin-top: 9px; font-size: 12.5px; color: var(--ink-3); }

/* ── Actions ─────────────────────────────────────────────────────────── */

/* ── Footer ──────────────────────────────────────────────────────────── */
footer { margin-top: 52px; border-top: 1px solid var(--rule); padding-top: 16px; }
footer p { font-size: 12.5px; color: var(--ink-3); margin: 0 0 7px; max-width: 78ch; }
footer code { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }
.tile .k { display:block; }
.tile .v { display:block; font-size:26px; font-weight:600; letter-spacing:-.01em; margin:4px 0 2px; }
.tile .n { display:block; font-size:12.5px; color:var(--ink-3); }
.bars .qual { font-weight:400; color:var(--ink-3); font-size:12px; margin-left:7px; }
.bars .nums { font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.fill.is-crit { background:var(--warn); }
tr.ph td { color:var(--ink-3); }
tr.hi td { font-weight:600; border-top:1px solid var(--rule); }
.chip { font-size:11px; }
.tscroll { overflow-x:auto; margin-top:14px; }
.tscroll table { width:100%; border-collapse:collapse; font-size:13px; }
.tscroll th, .tscroll td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--rule-soft); white-space:nowrap; }
.tscroll th:first-child, .tscroll td:first-child { text-align:left; }
.tscroll th { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:600; }
</style>
</head>

const rs  = v => "₹" + v.toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2});
const rs0 = v => "₹" + Math.round(v).toLocaleString("en-IN");
const n   = v => v.toLocaleString("en-IN");
const pct = (a,b) => b ? (100*a/b) : 0;
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const plural = (k, one, many) => k === 1 ? one : many;

const dayLabel = iso => {
  const [, mo, d] = iso.split("-").map(Number);
  return d + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][mo-1];
};

/* The snapshot day is still accruing, so it never sets a headline number. */
const PART   = DAILY.find(r => r[0] === SNAP_DAY) || null;
const FULL   = DAILY.filter(r => r[0] !== SNAP_DAY);
const NDAYS  = FULL.length;
const sum    = (rows, i) => rows.reduce((a, r) => a + r[i], 0);
const SPEND  = Math.round(sum(FULL,1)*100)/100, IMPR = sum(FULL,2),
      LPV    = sum(FULL,3), ATC = sum(FULL,4), LEADS = sum(FULL,5);
const CPL    = LEADS ? SPEND/LEADS : 0;
const cplOf  = r => r[5] ? r[1]/r[5] : null;

const last   = FULL[FULL.length-1], first = FULL[0];
/* A day with no spend is not the "cheapest" day - it bought nothing. Rank only
   days that actually spent, so an empty day cannot set the range. */
const ranked = FULL.filter(r => r[5] && r[1] > 0).slice().sort((a,b) => cplOf(a)-cplOf(b));
const best   = ranked[0], worst = ranked[ranked.length-1];
const span   = FULL.length > 1 ? dayLabel(first[0]) + " – " + dayLabel(last[0]) : dayLabel(last[0]);

/* Longest bar stops at 88% so the end-label always has room in the track. */
const BARW = 88;
const el = (id, html) => { const e = document.getElementById(id); if (e) e.innerHTML = html; };

/* -- masthead -------------------------------------------------------- */
el("period", esc(span) + " · " + NDAYS + " full " + plural(NDAYS,"day","days")
   + (PART ? " · " + esc(dayLabel(PART[0])) + " still running" : ""));
el("snapline", "Snapshot " + esc(SNAP_TS) + " · Meta ad account " + esc(ACCOUNT));

/* A mid-run change in what Meta optimised for. Flag it rather than let the
   reader compare two halves that are not measuring the same thing. */
el("change", CHANGE
  ? "<strong>Optimisation changed on " + esc(dayLabel(CHANGE[0])) + ".</strong> " + CHANGE[1]
  : "");

/* Other campaigns share this ad account. They sell something else and report no
   quiz leads, so their spend is held out of every figure on this page. */
el("scope", OTHER.length
  ? "Quiz campaigns only. " + OTHER.map(o => esc(o[0]) + " (" + rs(o[1])
      + (o[5] ? (o[4] === o[5] ? " on " + esc(dayLabel(o[4])) : " to " + esc(dayLabel(o[5])))
                + ", since paused"
              : " since " + esc(dayLabel(o[4]))) + ")").join(", ")
    + " " + plural(OTHER.length,"runs","run") + " on the same ad account and "
    + plural(OTHER.length,"is","are") + " excluded here, because "
    + plural(OTHER.length,"it reports","they report") + " no quiz leads and would make"
    + " every lead look dearer than it is."
  : "");

/* -- headline tiles -------------------------------------------------- */
el("tiles", [
  ["Spend", rs0(SPEND), NDAYS + " full " + plural(NDAYS,"day","days")
     + (PART && PART[1] ? ", plus " + rs(PART[1]) + " today so far"
        : PART ? ", nothing spent today yet" : "")],
  ["Quiz leads", n(LEADS), PART && PART[1] ? n(PART[5]) + " more today so far"
     : PART ? "no delivery today yet" : "across the period"],
  ["Cost per lead", rs(CPL), best && worst && best !== worst
     ? "ranged " + rs(cplOf(best)) + " – " + rs(cplOf(worst)) + " by day" : "blended"],
  ["Landing page views", n(LPV), pct(LEADS,LPV).toFixed(0) + "% of them became leads"],
].map(([k,v,note]) =>

  + '<span class="v mono">' + v + '</span><span class="n">' + esc(note) + '</span></div>'
).join(""));

/* -- latest day ------------------------------------------------------ */
(() => {
  const r = PART || last, isPart = !!PART;
  const cpl = cplOf(r);
  const vs = (!isPart && FULL.length > 1) ? (() => {
    const p = FULL[FULL.length-2], a = cplOf(p);
    if (!a || !cpl) return "";
    const d = (cpl-a)/a*100;
    return " That is " + Math.abs(d).toFixed(0) + "% " + (d < 0 ? "cheaper" : "dearer")
         + " than " + dayLabel(p[0]) + ".";
  })() : "";
  el("latest-h", (isPart ? "Today so far" : "Latest full day") + " — " + esc(dayLabel(r[0])));
  if (isPart && !r[1] && !r[2]) {
    /* "since yesterday" is wrong if yesterday was also empty - walk back to real spend */
    const lastSpend = FULL.filter(d => d[1] > 0).pop() || last;
    const darkDays  = DAILY.filter(d => d[0] > lastSpend[0]).length;
    el("latest", "<p><strong>Nothing has run today.</strong> The quiz campaigns last spent on "
      + esc(dayLabel(lastSpend[0])) + " — " + rs(lastSpend[1]) + " for " + n(lastSpend[5]) + " "
      + plural(lastSpend[5],"lead","leads") + " — and have been dark for "
      + darkDays + " " + plural(darkDays,"day","days") + " since. "
      + (CAMPS.some(c => c[2] === "ACTIVE")
          ? "They are still switched on at Meta, so this is a delivery or budget stop"
            + " rather than a campaign that was turned off."

            + " deliberate stop rather than a delivery problem.")
      + " Everything above covers the " + NDAYS + " full " + plural(NDAYS,"day","days")
      + " to " + esc(dayLabel(last[0])) + ".</p>");
    return;

  el("latest", "<p>" + rs(r[1]) + " spent, " + n(r[2]) + " impressions, " + n(r[3])
    + " landing page views and <strong>" + n(r[5]) + " " + plural(r[5],"lead","leads") + "</strong>"
    + (cpl ? " at <strong>" + rs(cpl) + "</strong> each." : ".")

    + (isPart ? " Today is still accruing, so it is excluded from every total above." : "")
    + "</p>");

/* -- day by day ------------------------------------------------------ */
(() => {

  el("daily-bars", '<div class="bars">' + rows.map(r => {
    const cpl = cplOf(r), part = r[0] === SNAP_DAY;

  el("daily-table",

    + '</td><td class="mono">' + rs(CPL) + '</td></tr></tbody></table>');

  const splitNote = CHANGE ? (() => {
    const before = FULL.filter(d => d[0] < CHANGE[0] && d[1] > 0);
    const after  = FULL.filter(d => d[0] >= CHANGE[0] && d[1] > 0);
    if (!before.length || !after.length) return "";
    const cplOfSet = set => sum(set,1) / sum(set,5);
    return " Split at the optimisation change, that is <strong>" + rs(cplOfSet(before))
      + "</strong> a lead over the " + before.length + " lead-optimised "
      + plural(before.length,"day","days") + " and <strong>" + rs(cplOfSet(after))
      + "</strong> over the " + after.length + " since &mdash; a different goal, not"
      + " necessarily worse buying.";
  })() : "";
  el("daily-intro", (best && worst && best !== worst
    ? "Cost per lead has run between <strong>" + rs(cplOf(best)) + "</strong> on " + esc(dayLabel(best[0]))
      + " and <strong>" + rs(cplOf(worst)) + "</strong> on " + esc(dayLabel(worst[0]))
      + ", against a blended " + rs(CPL) + " across the " + NDAYS + " full "
      + plural(NDAYS,"day","days") + "."
    : "One full day of delivery so far.") + splitNote);
})();

  const totSpend = AGE.reduce((a,r) => a+r[2], 0);

  const bestBand = rows.filter(r=>r[4]).sort((a,b) => a[1]/a[4] - b[1]/b[4])[0];

    + plural(wL,"lead","leads") + " — " + pct(wS, totSpend).toFixed(1) + "% of budget.");

  + (PLACE_DRIFT ? ", except placement spend which carries " + rs(Math.abs(PLACE_DRIFT))
      + " of Meta's own breakdown rounding" : "") + "."
  + (OTHER.length ? " " + rs(OTHER.reduce((a,o) => a+o[1], 0)) + " of non-quiz spend on this"
      + " account is excluded, as noted at the top." : ""));
</script>
